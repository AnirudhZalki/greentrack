<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Plantation | GreenTrack</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* [Keep your existing CSS unchanged] */
        :root {
            --primary-green: #2ecc71;
            --dark-green: #27ae60;
            --text-light: #f4f4f4;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(0, 0, 0, 0.3);
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f2027; 
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.5)), 
                              url('https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=2670&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
        }

        .app-container { display: flex; height: 100vh; }

        .sidebar {
            width: var(--sidebar-width);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            color: var(--primary-green);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-link {
            text-decoration: none;
            color: rgba(255,255,255,0.7);
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .nav-link:hover, .nav-link.active {
            background: var(--primary-green);
            color: #fff;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
            transform: translateX(5px);
        }

        .main-content {
            flex: 1;
            padding: 2rem 3rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header { width: 100%; max-width: 600px; margin-bottom: 2rem; }
        header h1 { font-size: 2rem; font-weight: 600; margin-bottom: 5px; }
        
        .form-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .form-group { margin-bottom: 1.5rem; }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--primary-green);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.5); }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus { border-color: var(--primary-green); box-shadow: 0 0 10px rgba(46, 204, 113, 0.2); }

        .location-group { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 10px; }
        .location-group input { padding-left: 15px; text-align: center; background: rgba(255,255,255,0.05); cursor: not-allowed; }

        .btn-pick {
            background: transparent;
            border: 1px solid var(--primary-green);
            color: var(--primary-green);
            padding: 0 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: inherit;
            font-weight: 500;
        }
        .btn-pick:hover { background: var(--primary-green); color: white; }
        
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
        .btn-pulsing { background: var(--primary-green); color: white; animation: pulse-green 2s infinite; }

        .upload-zone {
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(0,0,0,0.2);
        }
        .upload-zone:hover { border-color: var(--primary-green); background: rgba(46, 204, 113, 0.05); }
        .upload-icon { font-size: 2rem; color: rgba(255,255,255,0.5); margin-bottom: 10px; }
        .file-name { color: var(--primary-green); font-weight: 600; margin-top: 10px; display: block; }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--primary-green);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }
        .btn-submit:hover { background: var(--dark-green); transform: translateY(-2px); }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1a2c33;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            border: 1px solid var(--glass-border);
            color: white;
        }

        #modalMap {
            height: 350px;
            border-radius: 15px;
            margin: 20px 0;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .modal-actions { display: flex; justify-content: flex-end; gap: 15px; }
        .btn-modal { padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; font-weight: 600;}
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; }
        .btn-confirm { background: var(--primary-green); color: white; }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; height: auto; overflow-y:auto;}
            .sidebar { width: 100%; flex-direction: row; justify-content: space-between; padding: 1rem; }
            .nav-link span { display: none; }
            .location-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <nav class="sidebar">
        <div class="logo">
            <i class="fas fa-leaf"></i> GreenTrack
        </div>
        <div style="display:flex; flex-direction:column; gap:5px; width:100%;">
            <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> <span>Dashboard</span></a>
            <a href="map.html" class="nav-link"><i class="fas fa-map-marked-alt"></i> <span>Live Map</span></a>
            <a href="leaderboard.html" class="nav-link"><i class="fas fa-trophy"></i> <span>Leaderboard</span></a>
            <a href="profile.html" class="nav-link"><i class="fas fa-user-circle"></i> <span>Profile</span></a>
            
            <button onclick="logout()" class="nav-link" style="background:none; border:none; cursor:pointer; margin-top: 20px; text-align: left;">
                <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <header>
            <h1>🌱 Add Plantation</h1>
            <p style="opacity: 0.7;">Log a new tree and earn eco-points.</p>
        </header>

        <div class="form-card">
            <form id="plantForm" onsubmit="submitPlantation(event)">
                
                <div class="form-group">
                    <label>Tree Species / Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-tree"></i>
                        <input type="text" id="treeName" name="treeName" placeholder="e.g. Oak, Neem, Mango" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Location (GPS)</label>
                    <div class="location-group">
                        <input type="text" id="lat" name="latitude" placeholder="Lat" readonly>
                        <input type="text" id="lng" name="longitude" placeholder="Lng" readonly>
                        
                        <button type="button" class="btn-pick" id="btnGPS" onclick="getAutoLocation()">
                            <i class="fas fa-location-crosshairs"></i> GPS
                        </button>
                        
                        <button type="button" class="btn-pick" onclick="openMap()">
                            <i class="fas fa-map-marker-alt"></i> Map
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Verification Photo</label>
                    <div class="upload-zone" onclick="document.getElementById('photo').click()">
                        <i class="fas fa-cloud-upload-alt upload-icon"></i>
                        <p style="margin:0; opacity: 0.7;">Click to Upload or Drag Photo</p>
                        <input type="file" id="photo" name="photo" accept="image/*" style="display: none;" onchange="previewFile()" required>
                        <span id="fileName" class="file-name"></span>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    Submit Plantation <i class="fas fa-arrow-right" style="margin-left:8px;"></i>
                </button>
            </form>
        </div>
    </main>
</div>

<div id="mapModal" class="modal">
    <div class="modal-content">
        <h3 style="margin:0;">📍 Select Location</h3>
        <p style="font-size:0.9rem; opacity:0.7;">Drag the marker to the tree's location.</p>
        
        <div id="modalMap"></div>
        
        <div class="modal-actions">
            <button type="button" class="btn-modal btn-cancel" onclick="closeMap()">Cancel</button>
            <button type="button" class="btn-modal btn-confirm" onclick="saveLocation()">Confirm</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    let map, marker;
    const defaultLat = 15.3647; // Hubli
    const defaultLng = 75.1240;

    // --- 1. Auto GPS Logic ---
    function getAutoLocation() {
        const btn = document.getElementById('btnGPS');
        if (!navigator.geolocation) {
            alert("Geolocation not supported.");
            return;
        }

        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Finding...';
        btn.classList.add('btn-pulsing');

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude.toFixed(6);
                const lng = position.coords.longitude.toFixed(6);

                document.getElementById('lat').value = lat;
                document.getElementById('lng').value = lng;

                btn.innerHTML = '<i class="fas fa-check"></i> Found';
                btn.classList.remove('btn-pulsing');
                btn.style.background = '#27ae60';
                btn.style.color = 'white';
            },
            (error) => {
                console.error(error);
                alert("Could not get location.");
                btn.innerHTML = '<i class="fas fa-exclamation-circle"></i> Retry';
                btn.classList.remove('btn-pulsing');
            }
        );
    }

    // --- 2. Map with Layer Selection ---
    function openMap() {
        document.getElementById('mapModal').style.display = 'flex';
        
        const currentLat = parseFloat(document.getElementById('lat').value) || defaultLat;
        const currentLng = parseFloat(document.getElementById('lng').value) || defaultLng;

        if (!map) {
            setTimeout(() => {
                // Initialize Map
                map = L.map('modalMap', {
                    center: [currentLat, currentLng],
                    zoom: 15
                });

                // A. Define Layers
                const standard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap'
                });

                const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Tiles © Esri'
                });

                // B. Add Default Layer
                standard.addTo(map);

                // C. Add Layer Control (User Selector)
                const baseMaps = {
                    "Standard (Bright)": standard,
                    "Satellite (Forest)": satellite
                };
                L.control.layers(baseMaps).addTo(map);

                // D. Marker
                marker = L.marker([currentLat, currentLng], {draggable: true}).addTo(map);

            }, 100);
        } else {
            setTimeout(() => {
                map.invalidateSize();
                const newPos = new L.LatLng(currentLat, currentLng);
                marker.setLatLng(newPos);
                map.setView(newPos, 15);
            }, 100);
        }
    }

    function closeMap() {
        document.getElementById('mapModal').style.display = 'none';
    }

    function saveLocation() {
        const position = marker.getLatLng();
        document.getElementById('lat').value = position.lat.toFixed(6);
        document.getElementById('lng').value = position.lng.toFixed(6);
        closeMap();
    }

    // File Preview
    function previewFile() {
        const fileInput = document.getElementById('photo');
        const fileName = document.getElementById('fileName');
        if(fileInput.files.length > 0) {
            fileName.textContent = fileInput.files[0].name;
            document.querySelector('.upload-icon').style.color = '#2ecc71';
        }
    }

    // Submit
    async function submitPlantation(e) {
        e.preventDefault();
        const btn = document.querySelector('.btn-submit');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';

        const formData = new FormData();
        formData.append("treeName", document.getElementById('treeName').value);
        formData.append("latitude", document.getElementById('lat').value);
        formData.append("longitude", document.getElementById('lng').value);
        formData.append("photo", document.getElementById('photo').files[0]);

        const token = localStorage.getItem("token");

        try {
            const res = await fetch("/plant/add", {
                method: "POST",
                headers: { "Authorization": token },
                body: formData
            });
            const data = await res.json();
            if (res.ok) {
                alert("Success!");
                window.location.href = "profile.html"; 
            } else {
                alert("Error: " + data.message);
                btn.innerHTML = originalText;
            }
        } catch (err) {
            alert("Server Error");
            btn.innerHTML = originalText;
        }
    }

    function logout() {
        if(confirm("Logout?")) window.location.href = "login.html";
    }
</script>

</body>
</html>
