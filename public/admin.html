<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | GreenTrack</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Shared Theme */
        :root {
            --primary-green: #2ecc71;
            --dark-green: #27ae60;
            --danger-red: #e74c3c;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-light: #f4f4f4;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f2027; 
            background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.6)), 
                              url('https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=2670&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
        }

        .app-container { display: flex; height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
        }

        .logo { font-size: 1.5rem; font-weight: 700; margin-bottom: 3rem; color: var(--primary-green); display: flex; align-items: center; gap: 10px; }
        .nav-link { text-decoration: none; color: rgba(255,255,255,0.7); padding: 12px 15px; margin-bottom: 10px; border-radius: 12px; transition: all 0.3s ease; display: flex; align-items: center; gap: 12px; font-weight: 500; }
        .nav-link:hover, .nav-link.active { background: var(--primary-green); color: #fff; transform: translateX(5px); }

        .main-content { flex: 1; padding: 2rem 3rem; overflow-y: auto; }

        .section-title { font-size: 1.5rem; margin: 30px 0 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; font-weight: 600; }

        /* Admin Grid */
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        /* Plant/Fire Card */
        .plant-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .plant-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.12); }

        .plant-img {
            width: 100%; height: 180px; object-fit: cover;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
        }

        .plant-info h3 { font-size: 1.2rem; margin-bottom: 5px; color: var(--primary-green); }
        .plant-info p { font-size: 0.9rem; opacity: 0.8; display: flex; align-items: center; gap: 8px; }

        .btn-group { display: flex; gap: 10px; margin-top: auto; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: white; display: flex; align-items: center; justify-content: center; gap: 5px; }
        
        .btn-approve { background: var(--primary-green); }
        .btn-approve:hover { background: var(--dark-green); }
        
        .btn-reject { background: rgba(231, 76, 60, 0.2); border: 1px solid var(--danger-red); color: var(--danger-red); }
        .btn-reject:hover { background: var(--danger-red); color: white; }

        .btn-resolve { background: #3498db; }
        .btn-resolve:hover { background: #2980b9; }

        /* Empty State */
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 30px; opacity: 0.6; background: rgba(255,255,255,0.05); border-radius: 15px; }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; height: auto; }
            .sidebar { width: 100%; padding: 1rem; flex-direction: row; justify-content: space-between; }
            .nav-link span { display: none; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <nav class="sidebar">
        <div class="logo"><i class="fas fa-leaf"></i> GreenTrack</div>
        <div style="display:flex; flex-direction:column; gap:5px; width:100%;">
            <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> <span>Dashboard</span></a>
            <a href="map.html" class="nav-link"><i class="fas fa-map-marked-alt"></i> <span>Live Map</span></a>
            <a href="leaderboard.html" class="nav-link"><i class="fas fa-trophy"></i> <span>Leaderboard</span></a>
            <a href="profile.html" class="nav-link"><i class="fas fa-user-circle"></i> <span>Profile</span></a>
            <a href="admin.html" class="nav-link active"><i class="fas fa-shield-alt"></i> <span>Admin</span></a>
            <button onclick="logout()" class="nav-link" style="background:none; border:none; cursor:pointer; margin-top: 20px; text-align: left;">
                <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <header style="margin-bottom:2rem;">
            <h1 style="font-size:2rem; font-weight:600;">🛠 Admin Verification</h1>
            <p style="opacity:0.7;">Approve tree plantations and fire reports.</p>
        </header>

        <h2 class="section-title" style="color: #e74c3c;">🔥 Active Fire Emergencies (Live on Map)</h2>
        <div id="active-fire-list" class="admin-grid">
            <div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Checking map...</div>
        </div>

        <h2 class="section-title">⏳ Pending Verification</h2>
        <div id="pending-list" class="admin-grid">
            <div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading requests...</div>
        </div>
    </main>
</div>

<script>
    const token = localStorage.getItem("token");

    // --- 1. LOAD ACTIVE FIRES (Verified & On Map) ---
    async function loadActiveFires() {
        if (!token) return;

        try {
            // Reusing /all route which returns all verified items
            const res = await fetch("/plant/all");
            const items = await res.json();
            
            // Filter only verified fires
            const fires = items.filter(i => i.type === 'fire');
            const container = document.getElementById("active-fire-list");
            container.innerHTML = "";

            if (fires.length === 0) {
                container.innerHTML = `<div class="empty-state">✅ No active fires reported.</div>`;
            } else {
                fires.forEach(p => {
                    const name = p.userId && p.userId.name ? p.userId.name : "Unknown";
                    container.innerHTML += `
                        <div class="plant-card" style="border: 2px solid #e74c3c; background: rgba(231, 76, 60, 0.15);">
                            <div style="text-align:center; padding:10px;">
                                <i class="fas fa-fire-extinguisher fa-3x" style="color: #e74c3c;"></i>
                            </div>
                            <div class="plant-info">
                                <h3 style="color:#e74c3c">Active Alert</h3>
                                <p>"${p.description}"</p>
                                <p><i class="fas fa-map-marker-alt"></i> ${p.latitude.toFixed(4)}, ${p.longitude.toFixed(4)}</p>
                                <p><i class="fas fa-user"></i> Rep: ${name}</p>
                            </div>
                            <div class="btn-group">
                                <button class="btn btn-resolve" onclick="resolveFire('${p._id}')" style="background:#27ae60;">
                                    <i class="fas fa-check-double"></i> Mark Extinguished
                                </button>
                            </div>
                        </div>`;
                });
            }
        } catch (e) { console.error(e); }
    }

    // --- 2. LOAD PENDING REQUESTS ---
    async function loadPending() {
        if (!token) return window.location.href = "login.html";

        try {
            const res = await fetch("/plant/pending", {
                headers: { "Authorization": token }
            });
            
            if (res.status === 401 || res.status === 403) {
                alert("Access Denied.");
                return window.location.href = "dashboard.html";
            }

            const items = await res.json();
            const container = document.getElementById("pending-list");
            container.innerHTML = "";

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-check-circle fa-2x" style="color:#2ecc71; margin-bottom:10px;"></i>
                        <p>No pending verifications.</p>
                    </div>`;
                return;
            }

            items.forEach(p => {
                let displayName = p.userId && p.userId.name ? p.userId.name : "Unknown User";

                if (p.type === 'fire') {
                    // --- RED FIRE CARD (Pending) ---
                    container.innerHTML += `
                        <div class="plant-card" id="card-${p._id}" style="border: 1px solid #e74c3c; background: rgba(231, 76, 60, 0.1);">
                            <div style="text-align:center; padding: 20px 0;">
                                <i class="fas fa-fire fa-3x" style="color: #e74c3c;"></i>
                            </div>
                            <div class="plant-info">
                                <h3 style="color: #e74c3c; margin-bottom:5px;">🔥 Fire Reported</h3>
                                <p style="font-size:0.9rem; margin-bottom:10px;">"${p.description || 'No description'}"</p>
                                <p><i class="fas fa-map-marker-alt"></i> ${p.latitude.toFixed(4)}, ${p.longitude.toFixed(4)}</p>
                                <p><i class="fas fa-user"></i> ${displayName}</p>
                            </div>
                            <div class="btn-group">
                                <button class="btn btn-reject" onclick="deleteItem('${p._id}')"><i class="fas fa-times"></i> Dismiss</button>
                                <button class="btn btn-approve" onclick="approve('${p._id}')" style="background: #e74c3c;"><i class="fas fa-check"></i> Verify & Email</button>
                            </div>
                        </div>`;
                } else {
                    // --- GREEN TREE CARD (Pending) ---
                    const imgUrl = p.photo ? `/uploads/${p.photo}` : 'https://via.placeholder.com/300x200';
                    container.innerHTML += `
                        <div class="plant-card" id="card-${p._id}">
                            <img src="${imgUrl}" class="plant-img">
                            <div class="plant-info" style="margin-top:10px;">
                                <h3 style="color:#2ecc71; margin-bottom:5px;">${p.treeName}</h3>
                                <p><i class="fas fa-map-marker-alt"></i> ${p.latitude}, ${p.longitude}</p>
                                <p><i class="fas fa-user"></i> ${displayName}</p>
                            </div>
                            <div class="btn-group">
                                <button class="btn btn-reject" onclick="deleteItem('${p._id}')"><i class="fas fa-times"></i> Reject</button>
                                <button class="btn btn-approve" onclick="approve('${p._id}')"><i class="fas fa-check"></i> Verify</button>
                            </div>
                        </div>`;
                }
            });
        } catch (error) {
            console.error(error);
        }
    }

    // --- ACTIONS ---

    // Approve (Moves to Map + Sends Email if Fire)
    async function approve(id) {
        if(!confirm("Verify this item? It will appear on the public map.")) return;

        try {
            const res = await fetch("/plant/approve/" + id, { 
                method: "PUT",
                headers: { "Authorization": token }
            });

            if (res.ok) {
                // Refresh both lists to show updated status
                refreshAll();
            }
        } catch (err) { alert("Server Error"); }
    }

    // Resolve Active Fire (Removes from Map)
    async function resolveFire(id) {
        if(!confirm("Has this fire been extinguished? This will remove the alert from the map.")) return;
        deleteItem(id);
    }

    // Delete Item (Reject Pending OR Extinguish Active)
    async function deleteItem(id) {
        try {
            const res = await fetch("/plant/delete/" + id, { 
                method: "DELETE", 
                headers: { "Authorization": token } 
            });
            
            if(res.ok) {
                refreshAll();
            }
        } catch(e) { console.error(e); }
    }

    function refreshAll() {
        loadActiveFires();
        loadPending();
    }

    function logout() {
        if(confirm("Logout?")) {
            localStorage.removeItem("token");
            window.location.href = "index.html";
        }
    }

    // Initialize
    refreshAll();
</script>

</body>
</html>
