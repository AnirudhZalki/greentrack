<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map | GreenTrack</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #2d3436;
            --primary-green: #2ecc71;
            --fire-red: #e74c3c;
        }

        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Poppins', sans-serif; }

        #liveMap { width: 100vw; height: 100vh; z-index: 1; }

        .floating-ui {
            position: absolute;
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            color: var(--text-dark);
            padding: 15px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Top Left: Header & Back */
        .map-header { top: 20px; left: 20px; display: flex; align-items: center; gap: 15px; }
        .back-btn { background: var(--text-dark); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Report Fire Button (Bottom Left) */
        .report-btn {
            bottom: 30px; left: 20px;
            background: var(--fire-red); color: white;
            border: none; padding: 12px 20px; border-radius: 50px;
            font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); transition: 0.3s;
        }
        .report-btn:hover { transform: scale(1.05); background: #c0392b; }
        .report-btn.active { animation: pulse 1.5s infinite; border: 2px solid white; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); } }

        /* Modal Styles */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; }
        .modal input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .btn-cancel { background: #ddd; color: #333; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .btn-submit { background: var(--fire-red); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="liveMap"></div>

    <div class="floating-ui map-header">
        <button class="back-btn" onclick="location.href='dashboard.html'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div>
            <h2 style="margin:0; font-size: 1.1rem; font-weight: 700;">Global Monitor</h2>
            <p style="margin:0; font-size: 0.8rem; color: #636e72;">Live Updates</p>
        </div>
    </div>

    <button class="floating-ui report-btn" onclick="toggleReportMode()" id="btnReport">
        <i class="fas fa-bullhorn"></i> Report Fire
    </button>

    <div id="fireModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #e74c3c; margin-top:0;"><i class="fas fa-fire"></i> Report Fire</h3>
            <p style="font-size: 0.9rem; color: #666;">Location captured. Please add details:</p>
            
            <input type="text" id="fireDesc" placeholder="Description (e.g. Huge smoke near highway)">
            <input type="hidden" id="fireLat">
            <input type="hidden" id="fireLng">
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-submit" onclick="submitFireReport()">Submit Report</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- 1. Map Initialization ---
        const map = L.map('liveMap', {
            center: [15.3647, 75.1240], // Hubli
            zoom: 13,
            zoomControl: false 
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // --- 2. Custom Icons ---
        const TreeIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/489/489969.png', 
            iconSize: [40, 40], 
            iconAnchor: [20, 40], 
            popupAnchor: [0, -40]
        });

        const FireIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/785/785116.png',
            iconSize: [35, 35],
            iconAnchor: [17, 35],
            popupAnchor: [0, -35],
            className: 'pulsing-icon' 
        });

        // --- 3. Load All Data (Trees & Fires) ---
        async function loadMapData() {
            try {
                const res = await fetch("/plant/all");
                const items = await res.json();
                
                items.forEach(item => {
                    if (!item.latitude || !item.longitude) return;

                    if (item.type === 'fire') {
                        // --- FIRE MARKER ---
                        L.marker([item.latitude, item.longitude], { icon: FireIcon })
                        .addTo(map)
                        .bindPopup(`
                            <div style="text-align:center; font-family:'Poppins';">
                                <b style="color:red;">🔥 Verified Fire Alert</b><br>
                                <span style="font-size:0.9rem;">${item.description}</span><br>
                                <span style="font-size:0.8rem; color:#666;">Reported by: ${item.userId ? item.userId.name : 'Unknown'}</span>
                            </div>
                        `);
                        
                        // Add Warning Circle
                        L.circle([item.latitude, item.longitude], {
                            color: 'red', fillColor: '#f03', fillOpacity: 0.3, radius: 1000
                        }).addTo(map);

                    } else {
                        // --- TREE MARKER ---
                        const img = item.photo ? `/uploads/${item.photo}` : 'https://via.placeholder.com/150';
                        
                        L.marker([item.latitude, item.longitude], { icon: TreeIcon })
                        .addTo(map)
                        .bindPopup(`
                            <div style="text-align:center; font-family:'Poppins'; width:160px;">
                                <img src="${img}" style="width:100%; height:100px; object-fit:cover; border-radius:8px; margin-bottom:8px;">
                                <b style="color:#2ecc71;">${item.treeName}</b><br>
                                <span style="font-size:0.8rem;">By: ${item.userId ? item.userId.name : 'Unknown'}</span>
                            </div>
                        `);
                    }
                });

            } catch (error) {
                console.log("Error loading map data", error);
            }
        }

        // --- 4. Fire Reporting Logic ---
        let reportMode = false;

        function toggleReportMode() {
            reportMode = !reportMode;
            const btn = document.getElementById('btnReport');
            
            if(reportMode) {
                btn.classList.add('active');
                btn.innerHTML = '<i class="fas fa-crosshairs"></i> Tap Location on Map';
                document.body.style.cursor = "crosshair";
            } else {
                btn.classList.remove('active');
                btn.innerHTML = '<i class="fas fa-bullhorn"></i> Report Fire';
                document.body.style.cursor = "default";
            }
        }

        // Listen for click on map
        map.on('click', function(e) {
            if(!reportMode) return;

            // Open Modal
            document.getElementById('fireLat').value = e.latlng.lat;
            document.getElementById('fireLng').value = e.latlng.lng;
            document.getElementById('fireModal').style.display = 'flex';
            
            // Turn off mode automatically
            toggleReportMode();
        });

        function closeModal() {
            document.getElementById('fireModal').style.display = 'none';
        }

        async function submitFireReport() {
            const desc = document.getElementById('fireDesc').value;
            const lat = document.getElementById('fireLat').value;
            const lng = document.getElementById('fireLng').value;
            const token = localStorage.getItem("token");

            if(!token) {
                alert("Please login to report.");
                return window.location.href = "login.html";
            }

            try {
                const res = await fetch("/plant/report-fire", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": token 
                    },
                    body: JSON.stringify({ description: desc, latitude: lat, longitude: lng })
                });

                if(res.ok) {
                    alert("Report Submitted! Admin will verify before it appears on the map.");
                    closeModal();
                } else {
                    alert("Failed to submit.");
                }
            } catch(e) { console.error(e); }
        }

        // Initialize
        loadMapData();

    </script>
</body>
</html>
