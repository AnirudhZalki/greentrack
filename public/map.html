<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map | GreenTrack</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --plantation-green: #00b894;
            --fire-red: #ff3f34;       
            --deforest-brown: #d63031; 
            --glass-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #2d3436;
        }

        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Poppins', sans-serif; }

        #liveMap { width: 100vw; height: 100vh; z-index: 1; }

        .floating-ui {
            position: absolute;
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            color: var(--text-dark);
            padding: 15px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Top Left: Header & Back */
        .map-header {
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: var(--text-dark);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .back-btn:hover { transform: scale(1.1); }

        /* Bottom Right: Legend (Moved from top-right to avoid layer control) */
        .map-legend {
            bottom: 30px;
            right: 20px;
            width: 220px;
        }

        .legend-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 10px; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        .legend-item { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 0.9rem; font-weight: 500; }
        .icon-box { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; color: white; font-size: 12px; }

        /* Bottom Center: Stats */
        .map-stats {
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            padding: 15px 40px;
            border-radius: 50px;
        }

        .stat-item { text-align: center; }
        .stat-val { display: block; font-weight: 800; font-size: 1.2rem; }
        .stat-lbl { font-size: 0.75rem; color: #636e72; font-weight: 600; text-transform: uppercase;}
    </style>
</head>
<body>

    <div id="liveMap"></div>

    <div class="floating-ui map-header">
        <button class="back-btn" onclick="location.href='dashboard.html'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div>
            <h2 style="margin:0; font-size: 1.1rem; font-weight: 700;">Global Monitor</h2>
            <p style="margin:0; font-size: 0.8rem; color: #636e72;">Live updates</p>
        </div>
    </div>

    <div class="floating-ui map-legend">
        <div class="legend-title">Map Legend</div>
        <div class="legend-item">
            <div class="icon-box" style="background: var(--plantation-green);"><i class="fas fa-tree"></i></div>
            <span>Plantations</span>
        </div>
        <div class="legend-item">
            <div class="icon-box" style="background: var(--deforest-brown);"><i class="fas fa-ban"></i></div>
            <span>Deforestation</span>
        </div>
        <div class="legend-item">
            <div class="icon-box" style="background: var(--fire-red);"><i class="fas fa-fire"></i></div>
            <span>Active Fire</span>
        </div>
    </div>

    <div class="floating-ui map-stats">
        <div class="stat-item">
            <span class="stat-val" style="color: var(--plantation-green);">2,401</span>
            <span class="stat-lbl">Planted</span>
        </div>
        <div class="stat-item">
            <span class="stat-val" style="color: var(--fire-red);">4</span>
            <span class="stat-lbl">Alerts</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 1. Define Layers ---
        const standard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles © Esri'
        });

        // --- 2. Init Map ---
        // Initialize with 'standard' layer by default
        const map = L.map('liveMap', {
            center: [15.3647, 75.1240],
            zoom: 13,
            layers: [standard], // Default layer
            zoomControl: false // Hide default zoom to put it somewhere else if needed (or just use scroll)
        });

        // Add Zoom control manually to bottom right
        L.control.zoom({ position: 'topright' }).addTo(map);

        // --- 3. Add Layer Control (The "Selector" Button) ---
        const baseMaps = {
            "Standard Map": standard,
            "Satellite View": satellite
        };
        L.control.layers(baseMaps).addTo(map);

        // --- 4. Define Marker Icons ---
        const plantIcon = L.divIcon({
            html: '<div style="background:#00b894; width:30px; height:30px; border-radius:50%; border:2px solid white; box-shadow:0 2px 5px rgba(0,0,0,0.3);"></div>',
            className: 'custom-marker'
        });

        // --- 5. Load Data ---
        async function loadMapData() {
            try {
                const res = await fetch("/plant/all");
                if(!res.ok) throw new Error("API Fail");
                const plants = await res.json();

                plants.forEach(plant => {
                    if(plant.latitude && plant.longitude) {
                        L.marker([plant.latitude, plant.longitude], { icon: plantIcon })
                        .addTo(map)
                        .bindPopup(`
                            <div style="font-family:'Poppins',sans-serif;">
                                <b style="color:#00b894; font-size:1.1rem;">${plant.treeName}</b><br>
                                <span style="font-size:0.8rem; color:#666;">Status: ${plant.verified ? "Verified ✅" : "Pending ⏳"}</span>
                            </div>
                        `);
                    }
                });
            } catch (error) {
                console.log("Mocking data due to fetch error...");
                // Just for testing if backend is offline
                L.marker([15.3647, 75.1240], { icon: plantIcon }).addTo(map).bindPopup("Test Tree (Hubli)");
            }
        }

        loadMapData();
    </script>
</body>
</html>
