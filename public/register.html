<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GreenTrack</title>
    
    <!-- CSS & Icons -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="background: var(--accent); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto;">
                <i class="fas fa-user-plus" style="font-size: 28px; color: var(--primary);"></i>
            </div>
            <h2 style="color: var(--primary-dark); margin: 0;">Join GreenTrack</h2>
            <p style="color: var(--text-light); margin-top: 5px;">Start your journey to a greener planet</p>
        </div>

        <div style="position: relative;">
            <i class="fas fa-user" style="position: absolute; left: 15px; top: 15px; color: var(--text-light);"></i>
            <input type="text" id="name" placeholder="Full Name" style="padding-left: 45px;">
        </div>

        <div style="position: relative;">
            <i class="fas fa-envelope" style="position: absolute; left: 15px; top: 15px; color: var(--text-light);"></i>
            <input type="email" id="email" placeholder="Email Address" style="padding-left: 45px;">
        </div>

        <div style="position: relative;">
            <i class="fas fa-lock" style="position: absolute; left: 15px; top: 15px; color: var(--text-light);"></i>
            <input type="password" id="password" placeholder="Password" style="padding-left: 45px;">
        </div>

        <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="register()">
            Create Account <i class="fas fa-arrow-right" style="margin-left: 5px;"></i>
        </button>

        <p class="switch-text" style="text-align: center; margin-top: 20px; color: var(--text-light);">
            Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Login</a>
        </p>
    </div>
</div>

<div id="toast-container"></div>

<!-- Scripts -->
<script src="script.js"></script>

<script>
async function register() {
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if(!name || !email || !password) {
        showToast("Please fill in all fields", "error");
        return;
    }

    try {
        const res = await fetch("/auth/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ name, email, password })
        });

        const data = await res.json();
        
        if (data.success) {
            showToast("Account created! Redirecting...", "success");
            setTimeout(() => {
                location.href = "login.html";
            }, 1500);
        } else {
            showToast(data.message || "Registration failed", "error");
        }
    } catch (error) {
        console.error("Registration Error:", error);
        showToast("Something went wrong. Try again.", "error");
    }
}
</script>

</body>
</html>
