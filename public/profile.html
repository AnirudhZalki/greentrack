<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | GreenTrack</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* [Your Existing Theme CSS - Kept Consistent] */
        :root {
            --primary-green: #2ecc71;
            --dark-green: #27ae60;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-light: #f4f4f4;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f2027; 
            background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.6)), 
                              url('https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=2670&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
        }

        .app-container { display: flex; height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
        }

        .logo { font-size: 1.5rem; font-weight: 700; margin-bottom: 3rem; color: var(--primary-green); display: flex; align-items: center; gap: 10px; }
        .nav-link { text-decoration: none; color: rgba(255,255,255,0.7); padding: 12px 15px; margin-bottom: 10px; border-radius: 12px; transition: all 0.3s ease; display: flex; align-items: center; gap: 12px; font-weight: 500; }
        .nav-link:hover, .nav-link.active { background: var(--primary-green); color: #fff; transform: translateX(5px); }

        .main-content { flex: 1; padding: 2rem 3rem; overflow-y: auto; }

        /* Profile Header */
        .profile-header {
            display: flex; align-items: center; gap: 30px;
            background: var(--glass-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 30px; margin-bottom: 30px; position: relative; overflow: hidden;
        }

        .avatar-container { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--primary-green); padding: 5px; z-index: 1; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        
        .profile-info { z-index: 1; flex: 1; }
        .profile-info h1 { font-size: 2rem; margin-bottom: 5px; }
        .profile-info p { opacity: 0.7; font-size: 0.95rem; }

        .btn-edit { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; z-index: 2;}
        .btn-edit:hover { background: var(--primary-green); border-color: var(--primary-green); }

        /* Stats */
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 20px; border-radius: 15px; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--primary-green); margin-bottom: 5px; }
        .stat-label { font-size: 0.9rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }

        /* Activity Feed */
        .activity-item { display: flex; align-items: center; background: rgba(255,255,255,0.03); padding: 15px 20px; border-radius: 12px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .activity-icon { width: 40px; height: 40px; background: rgba(46, 204, 113, 0.2); color: var(--primary-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; }
        .activity-details { flex: 1; }
        .activity-points { font-weight: 700; color: var(--primary-green); }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #1a2c33; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid var(--glass-border); }
        .form-input { width: 100%; padding: 12px; margin: 10px 0 20px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; outline: none; }
        .form-input:focus { border-color: var(--primary-green); }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; height: auto; }
            .sidebar { width: 100%; flex-direction: row; justify-content: space-between; padding: 1rem; }
            .nav-link span { display: none; }
            .profile-header { flex-direction: column; text-align: center; }
            .stats-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <nav class="sidebar">
        <div class="logo"><i class="fas fa-leaf"></i> GreenTrack</div>
        <div style="display:flex; flex-direction:column; gap:5px; width:100%;">
            <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> <span>Dashboard</span></a>
            <a href="map.html" class="nav-link"><i class="fas fa-map-marked-alt"></i> <span>Live Map</span></a>
            <a href="leaderboard.html" class="nav-link"><i class="fas fa-trophy"></i> <span>Leaderboard</span></a>
            <a href="profile.html" class="nav-link active"><i class="fas fa-user-circle"></i> <span>Profile</span></a>
            <button onclick="logout()" class="nav-link" style="background:none; border:none; cursor:pointer; margin-top: 20px; text-align: left;">
                <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <div class="profile-header">
            <div class="avatar-container">
                <img id="userAvatar" src="" class="avatar-img" alt="Profile">
            </div>
            <div class="profile-info">
                <h1 id="userName">Loading...</h1>
                <p id="userEmail">Fetching details...</p>
                <div style="margin-top:10px;">
                    <span id="userBadge" style="background:#f39c12; color:black; padding:4px 12px; border-radius:20px; font-weight:bold; font-size:0.8rem;">Rookie</span>
                </div>
            </div>
            <button class="btn-edit" onclick="openEditModal()"><i class="fas fa-pen"></i> Edit</button>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="totalTrees">0</div>
                <div class="stat-label">Trees Planted</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalPoints">0</div>
                <div class="stat-label">Eco Points</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="globalRank">--</div>
                <div class="stat-label">Global Rank</div>
            </div>
        </div>

        <h3 style="margin-bottom:20px;">Recent Activity</h3>
        <div id="activityList">
            <div style="opacity:0.5; padding:20px;">No recent activity found.</div>
        </div>
    </main>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-bottom:20px;">Edit Profile</h2>
        <label>Full Name</label>
        <input type="text" id="editName" class="form-input">
        
        <label>Email Address</label>
        <input type="email" id="editEmail" class="form-input">
        
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
            <button onclick="closeEditModal()" style="background:transparent; border:1px solid #aaa; color:white; padding:10px 20px; border-radius:8px; cursor:pointer;">Cancel</button>
            <button onclick="saveProfile()" style="background:#2ecc71; border:none; color:white; padding:10px 20px; border-radius:8px; cursor:pointer;">Save Changes</button>
        </div>
    </div>
</div>

<script>
    // 1. Fetch & Load Profile
    async function loadUserProfile() {
        const token = localStorage.getItem("token");
        if (!token) return window.location.href = "login.html";

        try {
            const res = await fetch("/auth/profile", {
                headers: { "Authorization": token }
            });
            
            if(!res.ok) throw new Error("Failed");
            const user = await res.json();

            // Populate UI
            document.getElementById('userName').innerText = user.name;
            document.getElementById('userEmail').innerText = user.email;
            document.getElementById('userBadge').innerText = user.badge || "Eco Rookie";
            document.getElementById('totalTrees').innerText = user.treesPlanted || 0;
            document.getElementById('totalPoints').innerText = user.points || 0;
            document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${user.name}&background=2ecc71&color=fff&size=128`;

            // Populate Activity
            const list = document.getElementById('activityList');
            if (user.history && user.history.length > 0) {
                list.innerHTML = user.history.map(item => `
                    <div class="activity-item">
                        <div class="activity-icon"><i class="fas fa-seedling"></i></div>
                        <div class="activity-details">
                            <span style="display:block; font-weight:600;">${item.action || "Planted a Tree"}</span>
                            <span style="font-size:0.8rem; opacity:0.6;">${new Date(item.date).toLocaleDateString()}</span>
                        </div>
                        <div class="activity-points">+${item.points}</div>
                    </div>
                `).join('');
            }
        } catch (e) {
            console.error(e);
        }
    }

    // 2. Edit Modal Logic
    function openEditModal() {
        document.getElementById('editName').value = document.getElementById('userName').innerText;
        document.getElementById('editEmail').value = document.getElementById('userEmail').innerText;
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    // 3. Save Changes
    async function saveProfile() {
        const name = document.getElementById('editName').value;
        const email = document.getElementById('editEmail').value;
        const token = localStorage.getItem("token");

        try {
            const res = await fetch("/auth/update", {
                method: "PUT",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": token 
                },
                body: JSON.stringify({ name, email })
            });

            if(res.ok) {
                alert("Profile Updated!");
                closeEditModal();
                loadUserProfile(); // Refresh data
            } else {
                alert("Update failed.");
            }
        } catch(e) {
            console.error(e);
        }
    }

    function logout() {
        if(confirm("Logout?")) {
            localStorage.removeItem("token");
            window.location.href = "index.html";
        }
    }

    loadUserProfile();
</script>
</body>
</html>
