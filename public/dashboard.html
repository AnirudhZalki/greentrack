<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GreenTrack</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="app-container">
    <nav class="sidebar">
        <div class="logo">
            <i class="fas fa-leaf"></i> GreenTrack
        </div>
        <a href="dashboard.html" class="nav-link active"><i class="fas fa-home"></i> Dashboard</a>
        <a href="map.html" class="nav-link"><i class="fas fa-map-marked-alt"></i> Live Map</a>
        <a href="leaderboard.html" class="nav-link"><i class="fas fa-trophy"></i> Leaderboard</a>
        <a href="profile.html" class="nav-link"><i class="fas fa-user-circle"></i> Profile</a>
        
        <div style="margin-top: auto;">
            <button onclick="logout()" class="nav-link" style="background:none; border:none; cursor:pointer; width:100%; font-size:16px;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <main class="main-content">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h1 style="margin:0;">Hello, User! 👋</h1>
                <p style="color: var(--text-light);">Let's make the world greener today.</p>
            </div>
            <div id="weather-widget" class="card" style="padding: 10px 20px; display: flex; align-items: center; gap: 15px;">
                <i class="fas fa-cloud-sun" style="font-size: 24px; color: orange;"></i>
                <div>
                    <strong>24°C</strong>
                    <div style="font-size: 12px; color: grey;">Sunny • Air Quality: Good</div>
                </div>
            </div>
        </header>

        <div class="stats-grid">
            
            <div class="card">
                <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                    <div style="background:var(--accent); padding:10px; border-radius:10px;">
                        <i class="fas fa-seedling" style="color:var(--primary); font-size:24px;"></i>
                    </div>
                </div>
                <h3>Plant a Tree</h3>
                <p style="color:var(--text-light);">Log a new plantation and earn points.</p>
                <button class="btn btn-primary" style="width:100%;" onclick="location.href='plantation_add.html'">Add Plant</button>
            </div>

            <div class="card">
                <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                    <div style="background:#e0f2fe; padding:10px; border-radius:10px;">
                        <i class="fas fa-globe-asia" style="color:#0284c7; font-size:24px;"></i>
                    </div>
                </div>
                <h3>Live Monitor</h3>
                <p style="color:var(--text-light);">View forests, fires, and alerts near you.</p>
                <button class="btn btn-outline" style="width:100%;" onclick="location.href='map.html'">Open Map</button>
            </div>

            <div class="card">
                 <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                    <div style="background:#fef3c7; padding:10px; border-radius:10px;">
                        <i class="fas fa-medal" style="color:#d97706; font-size:24px;"></i>
                    </div>
                </div>
                <h3>Your Impact</h3>
                <h2 style="margin: 10px 0; color:var(--primary-dark);">1,250 Pts</h2>
                <p style="font-size:13px; color:grey;">Next Badge: Forest Guardian</p>
            </div>

        </div>
    </main>
</div>

<div id="toast-container"></div>
<script src="script.js"></script>
<script>
    // Simulate user name loading
    // In real app, fetch from /auth/me
    document.querySelector('h1').innerText = "Hello, Eco-Warrior! 👋";
</script>
</body>
</html>
